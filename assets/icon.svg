  <rect x="6" y="6" width="244" height="244" rx="56" fill="#D6F1FA" stroke="#2B7A9B" stroke-width="8"/>
  <!-- sensors around the hub -->
  <g stroke="#2B7A9B" stroke-width="9" stroke-linecap="round">
    <line x1="128" y1="112" x2="62" y2="62"/>
    <line x1="128" y1="112" x2="194" y2="62"/>
    <line x1="128" y1="112" x2="62" y2="166"/>
  </g>
  <g fill="#2B7A9B">
    <circle cx="62" cy="62" r="19"/>
    <circle cx="194" cy="62" r="19"/>
    <circle cx="62" cy="166" r="19"/>
