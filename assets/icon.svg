  <!-- the hub -->
  <circle cx="128" cy="112" r="36" fill="#2B7A9B"/>
  <circle cx="128" cy="112" r="15" fill="#D6F1FA"/>
  <!-- DIY badge -->
  <rect x="124" y="176" width="112" height="52" rx="26" fill="#F2994A"/>
  <text x="180" y="212" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-weight="700" font-size="34" letter-spacing="2" fill="#FFFFFF">DIY</text>
